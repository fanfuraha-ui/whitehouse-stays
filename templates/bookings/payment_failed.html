{% extends "base.html" %}
{% block content %}
<section class="wrap section narrow">
  <h1>Payment didn't go through</h1>
  <p>No money was taken. You can try again from the branch page — availability is checked again.</p>
  <a class="btn btn-navy" href="{{ booking.branch.get_absolute_url }}">Try again</a>
  <a class="btn btn-outline" href="https://wa.me/{{ BRAND.whatsapp }}?text=Hi%2C%20payment%20failed%20for%20{{ booking.reference }}">WhatsApp us</a>
</section>
{% endblock %}
